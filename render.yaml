services:
  - type: web
    name: ai-career-learning-tracker
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev && node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.13.0"
      - key: DATABASE_URL
        sync: false
      - key: TRACKER_PASSWORD
        sync: false
